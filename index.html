<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beach Day</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#ffd23f">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="menu-screen" class="screen title-screen menu-screen">
        <img class="sun" src="assets/sun.png" alt="" aria-hidden="true" />
        <h1>Beach Day</h1>
        <p class="tag">Which game shall we play?</p>
        <div class="menu-kid is-hero" data-kid aria-hidden="true"></div>
        <div class="exhibits" role="listbox" aria-label="games" id="exhibits">
          <button type="button" class="exhibit is-on" data-game="tidy" role="option" aria-selected="true">
            <div class="exhibit-art tidy-art" aria-hidden="true">
              <img src="assets/sandcastle-turret-sand.png" alt="" />
              <img src="assets/shell-scallop-peach.png" alt="" />
              <img src="assets/rock-pebble-gray.png" alt="" />
            </div>
            <span class="exhibit-name">Tide Pool Tidy</span>
            <span class="exhibit-blurb">Sort the beach</span>
          </button>
          <button type="button" class="exhibit" data-game="puzzle" role="option" aria-selected="false">
            <div class="exhibit-art puzzle-art" aria-hidden="true">
              <div class="puzzle-thumb">
                <img src="assets/puzzles/01-beach.jpg" alt="" />
                <svg class="puzzle-seams" viewBox="0 0 120 90" preserveAspectRatio="none" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="#111111"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M 40.0 0.0 L 40.0 12.7 C 40.0 12.7  40.7 12.0  43.4 11.4 C 45.6 12.7  45.6 17.3  43.4 18.6 C 40.7 18.0  40.0 17.3  40.0 17.3 L 40.0 30.0
                       M 80.0 0.0 L 80.0 12.7 C 80.0 12.7  79.3 12.0  76.6 11.4 C 74.4 12.7  74.4 17.3  76.6 18.6 C 79.3 18.0  80.0 17.3  80.0 17.3 L 80.0 30.0
                       M 40.0 30.0 L 40.0 42.7 C 40.0 42.7  39.3 42.0  36.6 41.4 C 34.4 42.7  34.4 47.3  36.6 48.6 C 39.3 48.0  40.0 47.3  40.0 47.3 L 40.0 60.0
                       M 80.0 30.0 L 80.0 42.7 C 80.0 42.7  80.7 42.0  83.4 41.4 C 85.6 42.7  85.6 47.3  83.4 48.6 C 80.7 48.0  80.0 47.3  80.0 47.3 L 80.0 60.0
                       M 40.0 60.0 L 40.0 72.7 C 40.0 72.7  40.7 72.0  43.4 71.4 C 45.6 72.7  45.6 77.3  43.4 78.6 C 40.7 78.0  40.0 77.3  40.0 77.3 L 40.0 90.0
                       M 80.0 60.0 L 80.0 72.7 C 80.0 72.7  79.3 72.0  76.6 71.4 C 74.4 72.7  74.4 77.3  76.6 78.6 C 79.3 78.0  80.0 77.3  80.0 77.3 L 80.0 90.0
                       M 0.0 30.0 L 17.7 30.0 C 17.7 30.0  17.0 30.7  16.4 33.4 C 17.7 35.6  22.3 35.6  23.6 33.4 C 23.0 30.7  22.3 30.0  22.3 30.0 L 40.0 30.0
                       M 40.0 30.0 L 57.7 30.0 C 57.7 30.0  57.0 29.3  56.4 26.6 C 57.7 24.4  62.3 24.4  63.6 26.6 C 63.0 29.3  62.3 30.0  62.3 30.0 L 80.0 30.0
                       M 80.0 30.0 L 97.7 30.0 C 97.7 30.0  97.0 30.7  96.4 33.4 C 97.7 35.6  102.3 35.6  103.6 33.4 C 103.0 30.7  102.3 30.0  102.3 30.0 L 120.0 30.0
                       M 0.0 60.0 L 17.7 60.0 C 17.7 60.0  17.0 59.3  16.4 56.6 C 17.7 54.4  22.3 54.4  23.6 56.6 C 23.0 59.3  22.3 60.0  22.3 60.0 L 40.0 60.0
                       M 40.0 60.0 L 57.7 60.0 C 57.7 60.0  57.0 60.7  56.4 63.4 C 57.7 65.6  62.3 65.6  63.6 63.4 C 63.0 60.7  62.3 60.0  62.3 60.0 L 80.0 60.0
                       M 80.0 60.0 L 97.7 60.0 C 97.7 60.0  97.0 59.3  96.4 56.6 C 97.7 54.4  102.3 54.4  103.6 56.6 C 103.0 59.3  102.3 60.0  102.3 60.0 L 120.0 60.0"
                  />
                </svg>
              </div>
            </div>
            <span class="exhibit-name">Beach Puzzle</span>
            <span class="exhibit-blurb">Snap the picture</span>
          </button>
          <button type="button" class="exhibit" data-game="path" role="option" aria-selected="false">
            <div class="exhibit-art path-art" aria-hidden="true">
              <img src="assets/crab.png" alt="" />
              <img src="assets/bucket.png" alt="" />
            </div>
            <span class="exhibit-name">Crab Path</span>
            <span class="exhibit-blurb">Hop to the bucket</span>
          </button>
        </div>
        <div class="menu-crab" id="menu-crab" aria-hidden="true">
          <img src="assets/crab.png" alt="" />
        </div>
      </section>

      <section id="difficulty-screen" class="screen title-screen difficulty-screen hidden" hidden>
        <button type="button" class="back-btn difficulty-back" data-back>
          <span class="btn-icon" aria-hidden="true">
            <img src="assets/icon-house.png" alt="" />
          </span>
          Games
        </button>
        <img class="sun" src="assets/sun.png" alt="" aria-hidden="true" />
        <h1>Tide Pool Tidy</h1>
        <p class="tag">How hard today?</p>
        <div class="difficulty-row">
          <button type="button" class="btn" data-difficulty="easy">
            <span class="btn-icon" aria-hidden="true">
              <img src="assets/shell-scallop-peach.png" alt="" />
            </span>
            Easy
          </button>
          <button type="button" class="btn" data-difficulty="medium">
            <span class="btn-icon" aria-hidden="true">
              <img src="assets/shell-scallop-peach.png" alt="" />
              <img src="assets/shell-scallop-peach.png" alt="" />
            </span>
            Medium
          </button>
          <button type="button" class="btn" data-difficulty="hard">
            <span class="btn-icon" aria-hidden="true">
              <img src="assets/shell-scallop-peach.png" alt="" />
              <img src="assets/shell-scallop-peach.png" alt="" />
              <img src="assets/shell-scallop-peach.png" alt="" />
            </span>
            Hard
          </button>
        </div>
        <div class="menu-kid is-small" data-kid aria-hidden="true"></div>
      </section>

      <section id="play-screen" class="screen play-screen hidden" hidden>
        <div class="sky">
          <button type="button" class="back-btn" data-back>
            <span class="btn-icon" aria-hidden="true">
              <img src="assets/icon-house.png" alt="" />
            </span>
            Games
          </button>
          <img class="sun small" src="assets/sun.png" alt="" aria-hidden="true" />
          <p class="hint" id="round-hint"></p>
        </div>
        <div class="sand-stage">
          <div class="sand-kid" data-kid aria-hidden="true"></div>
          <div class="sand" id="sand" aria-label="things on the sand"></div>
        </div>
        <div class="surf" aria-hidden="true"></div>
        <div class="tide" id="pools" aria-label="tide pools"></div>
      </section>

      <section id="path-screen" class="screen path-screen hidden" hidden>
        <div class="sky">
          <button type="button" class="back-btn" data-back>
            <span class="btn-icon" aria-hidden="true">
              <img src="assets/icon-house.png" alt="" />
            </span>
            Games
          </button>
          <img class="sun small" src="assets/sun.png" alt="" aria-hidden="true" />
          <p class="hint" id="path-hint"></p>
        </div>
        <div class="path-stage">
          <div id="path-board" class="path-board" aria-label="sand path"></div>
          <div class="path-kid" data-kid aria-hidden="true"></div>
        </div>
      </section>

      <section id="puzzle-screen" class="screen path-screen puzzle-screen hidden" hidden>
        <div class="sky">
          <button type="button" class="back-btn" data-back>
            <span class="btn-icon" aria-hidden="true">
              <img src="assets/icon-house.png" alt="" />
            </span>
            Games
          </button>
          <img class="sun small" src="assets/sun.png" alt="" aria-hidden="true" />
        </div>
        <div class="puzzle-stage">
          <button type="button" id="puzzle-preview" class="puzzle-preview" aria-label="finished picture">
            <img id="puzzle-preview-img" alt="" draggable="false" />
          </button>
          <div id="puzzle-field" class="puzzle-field" aria-label="puzzle pieces"></div>
          <button type="button" id="puzzle-tidy" class="puzzle-tidy" aria-label="Tidy">
            <svg class="puzzle-tidy-mark" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="#111111"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 1.6 L13.9 9.1 L21.6 11 L13.9 12.9 L12 20.4 L10.1 12.9 L2.4 11 L10.1 9.1 Z"
              />
            </svg>
          </button>
          <div class="path-kid puzzle-kid" data-kid aria-hidden="true"></div>
          <div id="puzzle-peek" class="puzzle-peek hidden" hidden>
            <button type="button" id="puzzle-peek-dim" class="puzzle-peek-dim" aria-label="close picture"></button>
            <div class="puzzle-peek-frame">
              <img id="puzzle-peek-img" alt="" draggable="false" />
              <button type="button" id="puzzle-peek-close" class="puzzle-peek-close" aria-label="close picture">X</button>
            </div>
          </div>
        </div>
      </section>

      <div id="cheer" class="cheer hidden" hidden>
        <div class="cheer-kid" data-kid aria-hidden="true"></div>
        <p class="cheer-words" id="cheer-words">All tidy!</p>
        <div class="cheer-actions">
          <button type="button" id="play-again" class="btn hidden" hidden>
            <span class="btn-icon" aria-hidden="true">
              <img src="assets/icon-replay.png" alt="" />
            </span>
            Play again
          </button>
          <button type="button" id="more-games" class="btn btn-foam hidden" hidden>
            <span class="btn-icon" aria-hidden="true">
              <img src="assets/icon-house.png" alt="" />
            </span>
            More games
          </button>
        </div>
      </div>
    </main>
    <script src="game.js"></script>
    <script src="path.js"></script>
    <script src="puzzle.js"></script>
    <script src="puzzle-layout.js"></script>
    <script src="menu.js"></script>
    <script src="kid.js"></script>
    <script src="app.js"></script>
  </body>
</html>

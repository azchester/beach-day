<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beach Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="menu-screen" class="screen title-screen menu-screen">
        <div class="sun" aria-hidden="true"></div>
        <h1>Beach Day</h1>
        <p class="tag">Which game shall we play?</p>
        <div class="exhibits" role="listbox" aria-label="games" id="exhibits">
          <button type="button" class="exhibit is-on" data-game="tidy" role="option" aria-selected="true">
            <div class="exhibit-art tidy-art" aria-hidden="true">
              <span class="mini-pool"></span>
              <span class="mini-pool"></span>
              <span class="mini-pool"></span>
            </div>
            <span class="exhibit-name">Tide Pool Tidy</span>
            <span class="exhibit-blurb">Sort the beach</span>
          </button>
          <button type="button" class="exhibit" data-game="path" role="option" aria-selected="false">
            <div class="exhibit-art path-art" aria-hidden="true">
              <span class="mini-tile"></span>
              <span class="mini-tile glow"></span>
              <span class="mini-tile"></span>
              <span class="mini-crab"></span>
              <span class="mini-bucket"></span>
            </div>
            <span class="exhibit-name">Crab Path</span>
            <span class="exhibit-blurb">Hop to the bucket</span>
          </button>
        </div>
        <div class="menu-crab" id="menu-crab" aria-hidden="true">
          <svg viewBox="0 0 80 50">
            <ellipse cx="40" cy="28" rx="20" ry="13" fill="#ff6a4d" stroke="#1b2a4a" stroke-width="3.2" />
            <path d="M22 24 L10 16 M58 24 L70 16 M20 32 L8 36 M60 32 L72 36 M24 38 L16 46 M56 38 L64 46" fill="none" stroke="#1b2a4a" stroke-width="3" stroke-linecap="round" />
            <circle cx="33" cy="24" r="3" fill="#1b2a4a" />
            <circle cx="47" cy="24" r="3" fill="#1b2a4a" />
          </svg>
        </div>
      </section>

      <section id="difficulty-screen" class="screen title-screen difficulty-screen hidden" hidden>
        <button type="button" class="back-btn difficulty-back" data-back>Games</button>
        <div class="sun" aria-hidden="true"></div>
        <h1>Tide Pool Tidy</h1>
        <p class="tag">How hard today?</p>
        <div class="difficulty-row">
          <button type="button" class="btn" data-difficulty="easy">Easy</button>
          <button type="button" class="btn" data-difficulty="medium">Medium</button>
          <button type="button" class="btn" data-difficulty="hard">Hard</button>
        </div>
      </section>

      <section id="play-screen" class="screen play-screen hidden" hidden>
        <div class="sky">
          <button type="button" class="back-btn" data-back>Games</button>
          <div class="sun small" aria-hidden="true"></div>
          <p class="hint" id="round-hint"></p>
        </div>
        <div class="sand" id="sand" aria-label="things on the sand"></div>
        <div class="surf" aria-hidden="true"></div>
        <div class="tide" id="pools" aria-label="tide pools"></div>
      </section>

      <section id="path-screen" class="screen path-screen hidden" hidden>
        <div class="sky">
          <button type="button" class="back-btn" data-back>Games</button>
          <div class="sun small" aria-hidden="true"></div>
          <p class="hint" id="path-hint"></p>
        </div>
        <div class="path-stage">
          <div id="path-board" class="path-board" aria-label="sand path"></div>
        </div>
      </section>

      <div id="cheer" class="cheer hidden" hidden>
        <p class="cheer-words" id="cheer-words">All tidy!</p>
        <div class="cheer-actions">
          <button type="button" id="play-again" class="btn hidden" hidden>Play again</button>
          <button type="button" id="more-games" class="btn btn-foam hidden" hidden>More games</button>
        </div>
      </div>
    </main>
    <script src="game.js"></script>
    <script src="path.js"></script>
    <script src="app.js"></script>
  </body>
</html>
